name: Build OpenFrame

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
      
    - name: Rebuild native modules
      run: |
        npm rebuild --runtime=electron --target=28.3.3 --disturl=https://electronjs.org/headers --build-from-source
      
    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Update main entry for packaging
      run: |
        # Temporarily update main entry point for packaging
        npm pkg set main="build/main.js"

    - name: Package application
      run: npm run package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      timeout-minutes: 30

    - name: Restore main entry point
      run: |
        # Restore original main entry point
        npm pkg set main="src/main/main.js"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenFrame-${{ runner.os }}
        path: |
          dist/*
          !dist/**/*.blockmap
          !dist/**/*.yaml
          !dist/**/*.yml
        if-no-files-found: error
        retention-days: 5
      continue-on-error: true

    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.dmg
          dist/*.exe
          dist/*.AppImage
          dist/*.zip
          dist/*.deb
          dist/*.rpm
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
